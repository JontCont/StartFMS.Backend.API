# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'StartFMS.Backend.API - CI'

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0.x'
          include-prerelease: true

      - name: Build with dotnet
        run: |
          dotnet build --configuration Release ./StartFMS.Backend.API/StartFMS.Backend.API.csproj
          dotnet build --configuration Release ./StartFMS.EF/StartFMS.EF.csproj
          dotnet build --configuration Release ./StartFMS.Entity/StartFMS.Entity.csproj
          dotnet build --configuration Release ./StartFMS.Entity/StartFMS.Enums.csproj
          dotnet build --configuration Release ./StartFMS.Entity/StartFMS.Models.csproj
        
      - name: Test with dotnet
        run: dotnet test --no-build ./StartFMS.Backend.API/StartFMS.Backend.API.csproj
